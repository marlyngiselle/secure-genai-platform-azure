[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "genai-service"
version = "0.1.0"
description = "Sample workload that calls an Azure OpenAI gateway with managed identity, streaming and guardrails."
readme = "app/README.md"
license = { text = "MIT" }
authors = [{ name = "Giselle Da Costa" }]
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "httpx>=0.27,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.6,<3.0",
  "azure-identity>=1.19,<2.0",
  "azure-monitor-opentelemetry>=1.6,<2.0",
  "opentelemetry-instrumentation-httpx>=0.48b0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.8,<1.0",
  "mypy>=1.13,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app/src/genai_service"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app/src", "app/tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM", "PT", "N"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"app/tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "app/src"
files = ["app/src", "app/tests"]
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["azure.monitor.opentelemetry.*", "opentelemetry.instrumentation.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["app/src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
source = ["genai_service"]
branch = true
